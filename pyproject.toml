[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playstore-success-prediction"
version = "0.1.0"
description = "Predict whether a Google Play Store app will be a 'success' using only release-time metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "imbalanced-learn>=0.13,<1",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "joblib>=1.4,<2",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1", "mypy>=1.10,<2", "jupyter>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Pinned to 3.12, not the project's "3.10" floor: numpy's own .pyi stubs
# use a PEP 695 `type X = ...` statement that mypy only accepts once its
# target is >= 3.12, and that gate is purely mypy-config-driven, not tied
# to whichever interpreter is actually running it (confirmed locally: the
# same environment fails under `--python-version 3.10` and passes under
# `--python-version 3.12`). Leaving this unset would still break CI's
# Python-3.11 matrix leg, since mypy would then default to targeting 3.11.
# The project's own code has no syntax that cares about this distinction.
python_version = "3.12"
ignore_missing_imports = true
