[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playstore-success-prediction"
version = "0.1.0"
description = "Predict whether a Google Play Store app will be a 'success' using only release-time metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "imbalanced-learn>=0.13,<1",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "joblib>=1.4,<2",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1", "mypy>=1.10,<2", "jupyter>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
